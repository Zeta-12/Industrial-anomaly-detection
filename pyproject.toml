[project]
name = "industrial-anomaly-detection"
version = "0.1.0"
description = "Unsupervised industrial defect detection (PatchCore, PaDiM) with calibrated thresholds and pixel-level evaluation."
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Julien Beloin" }]
requires-python = ">=3.11,<3.14"
dependencies = [
    "anomalib==2.7.0",
    "torch>=2.6",
    "torchvision>=0.21",
    "numpy>=2.0",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "matplotlib>=3.9",
    "pillow>=10.0",
    "pyyaml>=6.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
openvino = ["openvino>=2025.0"]

[project.scripts]
iad = "industrial_ad.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/industrial_ad"]

# CPU wheels by default; on a CUDA machine install torch from the matching index first.
[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
